
set -g status-right "%H:%M"
set -g mode-keys vi
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
# Restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Automatically save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
# Seamless navigation between tmux panes and Neovim
set -g @plugin 'christoomey/vim-tmux-navigator'
# Copy to clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
# Theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_status_style 'rounded'


# ============================================================
# MODERN TMUX — clean / Catppuccin-style
# ============================================================

# ---------- Prefix ----------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ---------- Terminal ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -sg escape-time 0

# ---------- General ----------
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

# Keep current directory when creating panes/windows
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# ============================================================
# PANES
# ============================================================

# Vim-style navigation
bind h select-pane -L 
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Zoom
bind z resize-pane -Z

# Kill pane
bind x kill-pane


# ============================================================
# WINDOWS
# ============================================================

bind -n C-Left previous-window
bind -n C-Right next-window

bind , command-prompt "rename-window '%%'"


# ============================================================
# COPY MODE
# ============================================================

bind [ copy-mode
bind ] paste-buffer

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g set-clipboard on


# ============================================================
# COLOURS
# ============================================================

# Catppuccin-ish palette
set -g @bg        "#1e1e2e"
set -g @surface   "#313244"
set -g @overlay   "#45475a"
set -g @text      "#cdd6f4"
set -g @subtext   "#a6adc8"

set -g @blue      "#89b4fa"
set -g @cyan      "#94e2d5"
set -g @green     "#a6e3a1"
set -g @yellow    "#f9e2af"
set -g @pink      "#f5c2e7"
set -g @red       "#f38ba8"


# ============================================================
# STATUS BAR
# ============================================================

set -g status on
set -g status-position bottom
set -g status-interval 1

set -g status-style "bg=#{@bg},fg=#{@text}"

set -g status-left-length 30
set -g status-right-length 80

# Left: session
set -g status-left \
"#[fg=#{@bg},bg=#{@blue},bold] 󰆍 #S #[fg=#{@blue},bg=#{@bg}]"

# Window list
set -g status-justify centre

setw -g window-status-format \
"#[fg=#{@subtext},bg=#{@bg}]  #I:#W  "

setw -g window-status-current-format \
"#[fg=#{@bg},bg=#{@cyan},bold]  #I:#W  #[fg=#{@cyan},bg=#{@bg}]"

setw -g window-status-separator ""

# Right side
set -g status-right \
"#[fg=#{@overlay}]│ #[fg=#{@yellow}]󰥔 #{T:%H:%M} #[fg=#{@overlay}]│ #[fg=#{@green}]󰘳 Faizu "


# ============================================================
# PANES / BORDERS
# ============================================================

set -g pane-border-style "fg=#{@surface}"
set -g pane-active-border-style "fg=#{@blue}"

# No ugly pane title bar
set -g pane-border-status off

# Active pane gets a subtle visual distinction
set -g window-style "bg=#{@bg}"
set -g window-active-style "bg=#{@bg}"


# ============================================================
# MESSAGES
# ============================================================

set -g message-style \
"fg=#{@text},bg=#{@surface},bold"

set -g message-command-style \
"fg=#{@cyan},bg=#{@surface},bold"


# ============================================================
# PREFIX INDICATOR
# ============================================================

# Shows a visual indicator while Ctrl-a is pressed
set -g status-left \
"#[fg=#{@bg},bg=#{@blue},bold] 󰆍 #S #[fg=#{@blue},bg=#{@bg}]"


# ============================================================
# RELOAD
# ============================================================

bind r source-file ~/.tmux.conf \; display-message "  tmux config reloaded  "
